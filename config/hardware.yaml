# hardware.yaml
# Central config for all hardware pin assignments and I2C addresses.
# Load this in src/components/core/config.py and pass values down to hardware modules.
# Never hardcode pins in hardware files — always read from here.

pca9685:
  i2c_address: 0x5f    # Adeept default (not the standard 0x40)
  frequency: 50        # PWM frequency in Hz

motors:
  rear:
    channel_in1: 15     # positive pole
    channel_in2: 14     # negative pole
    max_speed: 14
    accelerate_rate: 10          # units/second for forward acceleration
    reverse_accelerate_rate: 3   # units/second when starting from stop into reverse (slow creep)
    decelerate_rate: 200         # units/second for braking
    cm_per_speed_unit: 1.2  # cm/s per throttle unit — calibrate: run forward(6) for 1s, measure d_cm, set d_cm/6

servos:
  servo0:              # Front wheel steering (left / right)
    channel: 0         # TODO: verify correct PCA9685 channel from examples/03_servo.py
    center_angle: 94.68   # Straight ahead (calibrated)
    max_angle: 50      # Maximum right turn angle
    min_angle: 140     # Maximum left turn angle
    step_size: 5       # Angle change step size for smoother steering

  servo1:              # Head rotation left/right
    channel: 1
    center_angle: 89.85
    max_angle: 0       # Maximum right turn angle
    min_angle: 180     # Maximum left turn angle
    step_size: 5       # Angle change step size for smoother steering

  servo2:              # Head rotation up/down
    channel: 2
    center_angle: 69.64
    max_angle: 25
    min_angle: 120

debug_stream:
  enabled: true
  port: 8080
  fps: 10

websocket:
  host: "0.0.0.0"     # Listen on all interfaces so Mac can connect over WiFi
  port: 8765

webrtc:
  host: "0.0.0.0"
  port: 8766           # Signaling WS — WebRTC video negotiation only

cameras:
  front:
    index: 0              # Pi Camera V3 Wide Angle — CSI port 0
    main_width: 1920
    main_height: 1080
    lores_width: 640
    lores_height: 480
    framerate: 30.0
  back:
    index: 1              # Back camera — CSI port 1
    main_width: 640
    main_height: 480
    lores_width: 320
    lores_height: 240
    framerate: 30.0
    rotate_180: true      # Mounted upside down

ultrasonic:
  trigger_pin: 23
  echo_pin: 24
  max_distance: 2   # Maximum distance to measure in m (adjust based on sensor specs)
  height_cm: 14     # Sensor mount height above ground (5.5 in) — obstacles shorter than this are invisible to the beam
  stop_cm: 30       # Distance at which to stop
  turn_cm: 90       # Distance at which to start slowing down
  sudden_stop_cm: 20  # Distance at which to hard-stop immediately (must be < stop_cm)

ultrasonic_rear:
  # Separate, physically fixed-mount sensor at the rear of the chassis (NOT the servo1 head sensor).
  # This sensor does not rotate — it always faces rearward. The servo1 sensor is the forward sweep sensor
  # managed by _SweepCache; this is an independent sensor on different GPIO pins.
  trigger_pin:      # GPIO pin — set when rear sensor is installed (leave blank until then)
  echo_pin:         # GPIO pin — set when rear sensor is installed (leave blank until then)
  max_distance: 2
  stop_cm: 20       # stop reversing if rear obstacle detected within this distance

obstacle_avoidance:
  robot_width_cm: 20          # Measure actual chassis width and update
  clearance_buffer_cm: 10     # Minimum extra clearance required on each side to attempt passing
  focal_length_px: 259        # Geometric estimate: (lores_width/2) / tan(hfov_rad/2) = 320/tan(51°).
                               # Calibrate empirically: place a 30 cm object at 50 cm, measure pixel
                               # width W in the lores frame, then set to (W * 50) / 30.
  camera_hfov_deg: 102        # Pi Camera Module 3 Wide — horizontal FOV (not diagonal)

  # Multi-model list. Each entry is loaded independently; detections are merged via union + NMS.
  # Set enabled: false to skip a model without removing its entry.
  yolo_models:
    - path:        "src/components/ai/models/yolov8n_320.onnx"   # COCO baseline (80 classes)
      input_size:  320
      class_names: []          # empty → COCO label fallback in debug display
      enabled:     true

    - path:        "src/components/ai/models/best_320.onnx"       # custom-trained model (from train.ipynb)
      input_size:  320
      class_names: []          # set to ["obstacle"] after training
      enabled:     false       # flip to true once best_320.onnx is deployed to the Pi

  # Deprecated single-model keys — ignored when yolo_models is present; kept so any
  # code still reading these keys directly does not raise a KeyError.
  yolo_model:       "src/components/ai/models/yolov8n_320.onnx"
  yolo_input_size:  320
  yolo_class_names: []

face_tracking:
  detector: "auto"       # auto = YuNet if its model is deployed, else Haar cascades.
                         # "yunet" forces YuNet (startup error if missing); "cascade" forces Haar.
  min_face_size_px: 60   # ignore detections smaller than this (reduces false positives)

  frame_width: 640     # width of the camera frame to feed into the face detector
  frame_height: 480     # height of the camera frame to feed into the face detector 

  # YuNet — the pose-tolerant detector. Holds a face through head turn (yaw) and
  # tilt (roll), which the frontal Haar cascade cannot. ~340 KB; deploy with setup.sh's
  # curl + scp step. Gitignored like the YOLO weights.
  yunet_model: "src/components/ai/models/face_detection_yunet.onnx"
  yunet_score_threshold: 0.6   # raise if you get false positives, lower if faces at an angle drop out
  yunet_nms_threshold: 0.3
  yunet_top_k: 50

  # Haar cascade fallback — used only when YuNet is unavailable.
  # Empty = auto-detect (cv2.data.haarcascades, then common apt install paths).
  cascade_path: ""           # haarcascade_frontalface_default.xml
  profile_cascade_path: ""   # haarcascade_profileface.xml — recovers faces turned left/right
